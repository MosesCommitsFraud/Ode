# Sucht wöchentlich nach bekannten Sicherheitslücken in den Abhängigkeiten
# (RustSec für Cargo, npm-Advisories für die Oberfläche). Läuft auch, wenn
# sich die Lockfiles ändern.
name: Sicherheit

on:
  schedule:
    - cron: "0 5 * * 1"
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
