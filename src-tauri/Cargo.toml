[package]
name = "ode"
version = "0.1.0"
description = "Soundboard mit Mischpult und virtuellem Mikrofon"
authors = ["Moritz Schäfer"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
ringbuf = "0.5"
parking_lot = "0.12.5"
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
rusqlite = { version = "0.40", features = ["bundled"] }
symphonia = { version = "0.6", features = ["all"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
nnnoiseless = { version = "0.5.2", default-features = false }


# Audio-Bibliotheken auch im Debug-Build optimieren, sonst dekodiert symphonia
# ganze Titel spürbar langsam.
[profile.dev.package."*"]
opt-level = 2

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
