[package]
name = "ode"
version = "1.0.0"
description = "Soundboard mit Mischpult und virtuellem Mikrofon"
authors = ["Moritz Schäfer"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18"
ringbuf = "0.5"
parking_lot = "0.12.5"
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
rusqlite = { version = "0.40", features = ["bundled"] }
symphonia = { version = "0.6", features = ["all"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
nnnoiseless = { version = "0.5.2", default-features = false }
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Memory"] }
windows-core = "0.62"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
png = "0.18.1"
base64 = "0.22.1"
clack-host = { version = "0.2", optional = true }
clack-extensions = { version = "0.2", optional = true, features = ["clack-host", "audio-ports", "gui", "params", "latency"] }
clack-plugin = { version = "0.2", optional = true }
realfft = "3"


# Audio-Bibliotheken auch im Debug-Build optimieren, sonst dekodiert symphonia
# ganze Titel spürbar langsam.
[profile.dev.package."*"]
opt-level = 2

# Auch Odes eigener Code: Die Echtzeit-Effekte (Tonhöhe, Autotune, Hall)
# schaffen unoptimiert ihr Zeitbudget nicht und knacken im Dev-Build.
[profile.dev.package.ode]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
# Prototyp: CLAP-Plugins in der Mikrofon-Kette (siehe docs/plugins.md).
plugins = [
    "dep:clack-host",
    "dep:clack-extensions",
    "dep:clack-plugin",
    "clack-host/clack-plugin",
    "clack-extensions/clack-plugin",
]


